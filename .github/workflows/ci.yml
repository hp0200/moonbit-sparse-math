name: MoonBit CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MoonBit
      uses: hustcer/setup-moonbit@v1

    - name: Configure local Luna-Flow fallback
      run: |
        cat > moon.work <<'EOF'
        members = [
          ".",
          "./.mooncakes/Luna-Flow/luna-generic",
        ]
        EOF

    - name: Check code
      run: moon check .

    - name: Run tests
      run: moon test -p hp0200/moonbit-sparse-math
