name: MoonBit CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MoonBit
      uses: hustcer/setup-moonbit@v1

    - name: Check code
      run: moon check

    - name: Run tests
      run: moon test
